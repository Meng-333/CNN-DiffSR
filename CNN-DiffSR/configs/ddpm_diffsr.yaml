#################################
##  Configs for the Trainer    ##
#################################
trainer:
  pretrain_epochs: 0
  max_epochs: 500
  save_top_k: 20
  save_period: 10
  check_val_every_n_epoch: 1

#################################
##  Configs for the DataModule ##
#################################
data_module:
  name: DataModule
  args:
    num_workers: 8
    rgb_range: 1
    scale: 4
    train:
      data_path: load/Train
      data_length: 10632
      data_cache: memory
      hr_img_sz: 256
      batch_size: 8
    valid:
      data_path: load/val
      data_first_k: 1
      
#######################################
##  Configs for the LightningModule  ##
#######################################
lit_model:
  name: DDPMSRModel
  args:
    scale: 4
    mean: [0.5, 0.5, 0.5]
    std: [0.5, 0.5, 0.5]
    ###
    ema: true
    ema_rate: 0.999
    encoder:
#      name: RRDBNet
#      args:
#        scale: 4
#        num_in_ch: 3
#        num_out_ch: 3
#        num_feat: 64
#        num_block: 23
      name: SRDSRAN_Net
      args:
        in_channels: 3
        out_channels: 3
        n_residual_blocks: 12
        n_basic_blocks: 3
        rla_mode: 'CA-SA'
        bla_mode: 'CA-SA'
        ga_mode: 'CA-SA'
        pool_mode: 'Avg|Max'
        addconv: True
        upscale_factor: 4
      is_train: true
    diffusion_model:
      name: DDPM_UNet
      args:
        in_channel: 6
        out_channel: 3
        norm_groups: 32
        inner_channel: 64
        channel_mults: [1, 1, 2, 2, 4, 4]
        attn_res: [16]
        res_blocks: 2
        dropout: 0.2
        image_size: 256
    beta_schedule:
      schedule: linear
      linear_start: 0.0001
      linear_end: 0.02
      n_timestep: 1000
    diffusion:
      image_size: 256
      channels: 3
      conditional: True
      loss_type: 'l1'
    valid:
      eta: 0
      scale: 4
    optimizer:
      lr: 0.0002
      #lr_scheduler_milestones: [200, 400, 600, 800]
      lr_scheduler_milestones: [800]
      lr_scheduler_gamma: 0.5